name: Новости из Instagram

on:
  schedule:
    - cron: "17 */3 * * *"      # каждые три часа
  workflow_dispatch:
    inputs:
      since:
        description: "Забрать посты начиная с даты (ГГГГ-ММ-ДД), пусто — только новые"
        required: false
      dry:
        description: "Только показать, ничего не публиковать"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Собрать новости
        id: bot
        env:
          IG_TOKEN_NSART: ${{ secrets.IG_TOKEN_NSART }}
          IG_TOKEN_CEO: ${{ secrets.IG_TOKEN_CEO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          node tools/news-bot/bot.mjs \
            ${{ inputs.since && format('--since={0}', inputs.since) || '' }} \
            ${{ inputs.dry && '--dry' || '' }}

      - name: Проверить, что сайт собирается
        if: steps.bot.outputs.total != '0' && steps.bot.outputs.total != ''
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json

      # новости с официального аккаунта уходят сразу в main → Vercel их выкатывает
      - name: Опубликовать
        if: steps.bot.outputs.auto != '0' && steps.bot.outputs.review == '0' && !inputs.dry
        run: |
          git config user.name "NSART news bot"
          git config user.email "noreply@nsartgateway.com"
          git add lib/news.ts public/news tools/news-bot/state.json
          git commit -m "Новости: ${{ steps.bot.outputs.auto }} запись(и) из Instagram"
          git push

      # если в выборке есть посты с личной страницы CEO — только Pull Request
      - name: Отправить на ревью
        if: steps.bot.outputs.review != '0' && steps.bot.outputs.review != '' && !inputs.dry
        uses: peter-evans/create-pull-request@v6
        with:
          branch: news/from-instagram
          title: "Новости из Instagram: ${{ steps.bot.outputs.total }} запись(и) на проверку"
          body: |
            Подготовлено ботом из постов Instagram.
            Среди них есть записи с личной страницы — нужна проверка перед публикацией.

            Проверить: факты, формулировки на четырёх языках, фото.
          commit-message: "Новости из Instagram на проверку"
          add-paths: |
            lib/news.ts
            public/news
            tools/news-bot/state.json
